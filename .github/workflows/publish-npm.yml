name: Publish Chat SDK to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'chat-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Node and npm
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm supports trusted publishing
        run: |
          npm --version
          node -e "const [major, minor] = process.env.npm_config_user_agent.match(/npm\\/(\\d+)\\.(\\d+)/).slice(1).map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag and internal package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/check-npm-release.mjs

      - name: Build and typecheck
        run: |
          npm run build
          npm run typecheck
          npm run typecheck -w @sarchauhan/storybook
          npm run build -w @sarchauhan/storybook

      - name: Run tests and package smoke checks
        run: |
          node --test packages/chat/test/*.test.mjs
          node packages/chat/test/package-smoke.mjs
          npm pack -w @sarchauhan/chat --dry-run --ignore-scripts

      - name: Publish workspace packages in dependency order
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          for package in \
            @sarchauhan/protocol \
            @sarchauhan/adapter \
            @sarchauhan/adapter-ai-sdk \
            @sarchauhan/chat-tui \
            @sarchauhan/chat
          do
            version="$(node -p "require('./node_modules/$package/package.json').version")"
            if npm view "$package@$version" version --json >/dev/null 2>&1; then
              if [ "$package" = "@sarchauhan/chat" ]; then
                echo "::error::$package@$version is already published; aborting duplicate release."
                exit 1
              fi
              echo "Already published: $package@$version"
              continue
            fi
            echo "Publishing $package@$version"
            npm publish --workspace "$package" --access public
          done
