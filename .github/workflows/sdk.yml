name: SDK checks
on:
  pull_request:
  push:
    branches: [main, feat/prebuilt-widgets-package-layout]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: node --test packages/chat/test/*.test.mjs
      - run: npm run typecheck -w @sarchauhan/storybook
      - run: npm run build -w @sarchauhan/storybook
      - run: npx eslint packages/chat/src/widgets packages/protocol/src/activity.ts
      - run: npm pack -w @sarchauhan/chat --dry-run --ignore-scripts
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Desktop and mobile browser smoke
        run: node packages/chat/test/browser-smoke.cjs
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-activity-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
